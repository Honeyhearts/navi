<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navi Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=General+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'General Sans',sans-serif; background:#F6F8F9; color:#1A2028; padding:24px; }
  h1 { font-size:20px; font-weight:600; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
  .card { background:#fff; border:1px solid #DEE2E6; border-radius:10px; padding:20px; }
  .card-value { font-size:32px; font-weight:700; color:#4E96BD; }
  .card-label { font-size:12px; color:#6A7280; text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }
  .section-title { font-size:14px; font-weight:600; margin:20px 0 12px; text-transform:uppercase; letter-spacing:0.06em; color:#6A7280; }
  .list-item { display:flex; justify-content:space-between; padding:10px 16px; background:#fff; border:1px solid #DEE2E6; border-radius:8px; margin-bottom:6px; font-size:14px; }
  .list-count { font-family:'JetBrains Mono',monospace; font-weight:600; color:#4E96BD; }
  .refresh { font-size:12px; color:#6A7280; text-align:center; margin-top:20px; }
  .updated { font-family:'JetBrains Mono',monospace; font-size:11px; color:#6A7280; }
</style>
</head>
<body>
<h1>navi<span style="color:#4E96BD">.</span> live</h1>
<div class="updated" id="updated"></div>

<div class="grid">
  <div class="card"><div class="card-value" id="users">—</div><div class="card-label">Users</div></div>
  <div class="card"><div class="card-value" id="messages">—</div><div class="card-label">Messages</div></div>
  <div class="card"><div class="card-value" id="active">—</div><div class="card-label">Active (3+ msgs)</div></div>
  <div class="card"><div class="card-value" id="avg">—</div><div class="card-label">Avg msgs/user</div></div>
  <div class="card"><div class="card-value" id="referrals">—</div><div class="card-label">Referrals</div></div>
  <div class="card"><div class="card-value" id="summaries">—</div><div class="card-label">Summaries sent</div></div>
</div>

<div class="section-title">Archetypes</div>
<div id="archetypes"></div>

<div class="section-title">Top Requests</div>
<div id="requests"></div>

<div class="refresh">Auto-refreshes every 30s</div>

<script>
async function refresh() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    document.getElementById('users').textContent = d.total_users;
    document.getElementById('messages').textContent = d.total_messages;
    document.getElementById('active').textContent = d.active_conversations;
    document.getElementById('avg').textContent = d.avg_messages.toFixed(1);
    document.getElementById('referrals').textContent = d.referrals;
    document.getElementById('summaries').textContent = d.summaries_sent;
    document.getElementById('updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();

    const arch = document.getElementById('archetypes');
    arch.innerHTML = d.archetypes.map(a =>
      `<div class="list-item"><span>${a.context}</span><span class="list-count">${a.count}</span></div>`
    ).join('') || '<div class="list-item">No data yet</div>';

    const req = document.getElementById('requests');
    req.innerHTML = d.top_requests.map(r =>
      `<div class="list-item"><span>${r.category}</span><span class="list-count">${r.count}</span></div>`
    ).join('') || '<div class="list-item">No data yet</div>';
  } catch(e) { console.error(e); }
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
